[package]
name = "barber_api"
version = "0.1.0"
edition = "2024"

[dependencies]
# Database
sqlx = { version = "0.9.0", features = [ "runtime-tokio", "tls-rustls", "sqlite", "uuid" ] }

# Web Framework & Async
axum = { version = "0.8.9", features = ["multipart", "macros"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace", "cors"] }
rss = { version = "2.0", features = ["serde"] }

# HTTP Client (to talk to the Docker sidecar)
reqwest = { version = "0.13.4", features = ["json", "multipart"] }

sha2 = "0.11.0"
uuid = { version = "1.23.4", features = ["v4", "v5", "serde"] }
hex = "0.4"

# Serialization & Logging
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.12.0"

[dev-dependencies]
testcontainers = "0.27.3"
wiremock = "0.6"
tempfile = "3.10"